<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thompson Capital Group | Legacy. Capital. Execution.</title>
  <meta name="description" content="Thompson Capital Group is a family-owned private investment and consulting firm deploying capital into construction, infrastructure, technology, and government contracting." />
  <meta name="keywords" content="Thompson Capital Group, private equity, family office, government contracting, DoD consulting, construction investment, Truett Construction, Truett Roofing" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =========================================
       RESET & BASE
    ========================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:    #0A1428;
      --navy2:   #0D1B36;
      --navy3:   #112244;
      --gold:    #C9A55B;
      --gold2:   #E2C07A;
      --white:   #FFFFFF;
      --offwhite:#F7F5F0;
      --gray:    #6B7280;
      --lightgray:#E5E7EB;
      --charcoal:#1F2937;
      --text:    #374151;
      --serif:   'Playfair Display', Georgia, serif;
      --sans:    'Inter', system-ui, sans-serif;
      --transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--white);
      overflow-x: hidden;
      line-height: 1.7;
    }

    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .gold-line {
      display: block;
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 1.25rem 0;
    }

    .gold-line--center { margin: 1.25rem auto; }

    /* =========================================
       FADE-IN ANIMATIONS
    ========================================= */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-delay-1 { transition-delay: 0.1s; }
    .reveal-delay-2 { transition-delay: 0.2s; }
    .reveal-delay-3 { transition-delay: 0.3s; }
    .reveal-delay-4 { transition-delay: 0.4s; }

    /* =========================================
       NAVIGATION
    ========================================= */
    #navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: background var(--transition), box-shadow var(--transition), padding var(--transition);
      padding: 1.5rem 0;
    }

    #navbar.scrolled {
      background: rgba(10, 20, 40, 0.97);
      backdrop-filter: blur(12px);
      box-shadow: 0 2px 40px rgba(0,0,0,0.4);
      padding: 1rem 0;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .nav-logo {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-logo-name {
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.04em;
      line-height: 1.2;
    }

    .nav-logo-tag {
      font-size: 0.6rem;
      color: var(--gold);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: rgba(255,255,255,0.82);
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      position: relative;
      transition: color var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width var(--transition);
    }

    .nav-links a:hover { color: var(--gold); }
    .nav-links a:hover::after { width: 100%; }

    .nav-cta {
      border: 1px solid var(--gold) !important;
      color: var(--gold) !important;
      padding: 0.5rem 1.2rem;
      border-radius: 2px;
      transition: background var(--transition), color var(--transition) !important;
    }

    .nav-cta:hover {
      background: var(--gold) !important;
      color: var(--navy) !important;
    }

    .nav-cta::after { display: none !important; }

    /* Hamburger */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }

    .nav-hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--white);
      transition: var(--transition);
    }

    /* =========================================
       HERO
    ========================================= */
    #hero {
      position: relative;
      height: 100vh;
      min-height: 700px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1486325212027-8081e485255e?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center 40%;
      transform: scale(1.05);
      animation: heroZoom 12s ease-out forwards;
    }

    @keyframes heroZoom {
      from { transform: scale(1.08); }
      to   { transform: scale(1.0); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(10, 20, 40, 0.88) 0%,
        rgba(10, 20, 40, 0.72) 50%,
        rgba(10, 20, 40, 0.55) 100%
      );
    }

    /* Subtle crest watermark */
    .hero-crest {
      position: absolute;
      right: 6%;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      height: 280px;
      opacity: 0.07;
      pointer-events: none;
    }

    .hero-crest svg {
      width: 100%;
      height: 100%;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 900px;
      padding: 0 2rem;
    }

    .hero-eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 1.5rem;
      animation: fadeUp 1s ease 0.3s both;
    }

    .hero-title {
      font-family: var(--serif);
      font-size: clamp(2.8rem, 6vw, 5rem);
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 0.5rem;
      animation: fadeUp 1s ease 0.5s both;
    }

    .hero-title span {
      color: var(--gold);
      font-style: italic;
    }

    .hero-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin: 1.5rem 0;
      animation: fadeUp 1s ease 0.65s both;
    }

    .hero-divider::before,
    .hero-divider::after {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: var(--gold);
      opacity: 0.6;
    }

    .hero-divider-diamond {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    .hero-sub {
      font-size: clamp(1rem, 1.8vw, 1.15rem);
      color: rgba(255,255,255,0.8);
      line-height: 1.7;
      max-width: 680px;
      margin: 0 auto 2.5rem;
      font-weight: 300;
      animation: fadeUp 1s ease 0.8s both;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 1s ease 1s both;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
      padding: 0.9rem 2.2rem;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 2px;
      transition: background var(--transition), transform var(--transition);
      border: 2px solid var(--gold);
    }

    .btn-primary:hover {
      background: var(--gold2);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--white);
      padding: 0.9rem 2.2rem;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 500;
      border-radius: 2px;
      border: 2px solid rgba(255,255,255,0.5);
      transition: border-color var(--transition), color var(--transition), transform var(--transition);
    }

    .btn-outline:hover {
      border-color: var(--gold);
      color: var(--gold);
      transform: translateY(-2px);
    }

    .hero-scroll {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      animation: fadeUp 1s ease 1.4s both;
      cursor: pointer;
    }

    .hero-scroll span {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .scroll-line {
      width: 1px;
      height: 50px;
      background: linear-gradient(to bottom, rgba(201,165,91,0.7), transparent);
      animation: scrollPulse 2s ease infinite;
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.4; transform: scaleY(1); }
      50%       { opacity: 1;   transform: scaleY(1.1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* =========================================
       TRUST BAR
    ========================================= */
    #trust-bar {
      background: var(--navy);
      padding: 1.5rem 0;
      border-top: 1px solid rgba(201,165,91,0.15);
      border-bottom: 1px solid rgba(201,165,91,0.15);
    }

    .trust-bar-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .trust-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }

    .trust-item-num {
      font-family: var(--serif);
      font-size: 1.6rem;
      color: var(--gold);
      font-weight: 600;
      line-height: 1;
    }

    .trust-item-label {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      font-weight: 500;
    }

    .trust-divider {
      width: 1px;
      height: 40px;
      background: rgba(201,165,91,0.2);
    }

    /* =========================================
       SECTION COMMONS
    ========================================= */
    .section {
      padding: 7rem 0;
    }

    .section-light { background: var(--white); }
    .section-off   { background: var(--offwhite); }
    .section-dark  { background: var(--navy); }
    .section-navy2 { background: var(--navy2); }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 600;
      color: var(--charcoal);
      line-height: 1.2;
    }

    .section-title--light {
      color: var(--white);
    }

  <!-- ========== SCRIPTS ========== -->
  <script>
    /* ---- Navbar scroll behavior ---- */
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 60) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    }, { passive: true });

    /* ---- Mobile menu ---- */
    const hamburger = document.getElementById('hamburger');
    const navMobile = document.getElementById('navMobile');
    hamburger.addEventListener('click', () => {
      navMobile.classList.toggle('open');
    });

    function closeMenu() {
      navMobile.classList.remove('open');
    }

    /* ---- Scroll reveal (Intersection Observer) ---- */
    const revealElements = document.querySelectorAll('.reveal');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    revealElements.forEach(el => observer.observe(el));

    /* ---- Form submission handler ---- */
    function handleSubmit(e) {
      e.preventDefault();
      const btn = e.target.querySelector('.form-submit');
      btn.textContent = 'Inquiry Submitted â';
      btn.style.background = '#4a7c59';
      btn.style.color = '#fff';
      btn.disabled = true;
      setTimeout(() => {
        btn.textContent = 'Submit Inquiry';
        btn.style.background = '';
        btn.style.color = '';
        btn.disabled = false;
        e.target.reset();
      }, 4000);
    }

    /* ---- Active nav link highlight on scroll ---- */
    const sections = document.querySelectorAll('section[id], div[id]');
    const navLinksAll = document.querySelectorAll('.nav-links a');

    window.addEventListener('scroll', () => {
      let current = '';
      sections.forEach(section => {
        const sectionTop = section.offsetTop - 120;
        if (window.scrollY >= sectionTop) {
          current = section.getAttribute('id');
        }
      });
      navLinksAll.forEach(link => {
        link.style.color = '';
        if (link.getAttribute('href') === '#' + current) {
          link.style.color = 'var(--gold)';
        }
      });
    }, { passive: true });
  </script>
